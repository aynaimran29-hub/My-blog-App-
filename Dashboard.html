<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BlogSpace</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f6f3f4;
        }

        .navbar {
            background: linear-gradient(135deg, #7a1f4b, #5c1739);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .navbar h2 {
            color: white;
            margin: 0;
            font-family: Georgia, serif;
        }

        .navbar .nav-links { display: flex; align-items: center; }

        .navbar .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
            font-size: 15px;
            transition: 0.25s;
        }

        .navbar .nav-links a:hover { color: #f6c9dd; }

        .logout-btn {
            background-color: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.55);
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 22px;
            transition: 0.25s;
        }

        .logout-btn:hover {
            background-color: white;
            color: #7a1f4b;
            transform: translateY(-2px);
        }

        /* Hero with background image + gradient overlay */
        .hero {
            position: relative;
            overflow: hidden;
            padding: 60px 30px 90px 30px;
            background-image:
                linear-gradient(-45deg, rgba(122,31,75,0.85), rgba(161,58,104,0.85), rgba(92,23,57,0.85), rgba(61,15,40,0.85)),
                url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=60');
            background-size: 400% 400%, cover;
            background-position: center;
            animation: heroMove 14s ease infinite;
            perspective: 900px;
        }

        @keyframes heroMove {
            0%   { background-position: 0% 50%, center; }
            50%  { background-position: 100% 50%, center; }
            100% { background-position: 0% 50%, center; }
        }

        .hero h1 {
            color: white;
            font-family: Georgia, serif;
            font-size: 34px;
            margin: 0 0 8px 0;
            transform-origin: left center;
            animation: flipIn 1s cubic-bezier(.2,.8,.2,1) both;
        }

        .hero p {
            color: #f3d9e6;
            font-size: 15px;
            margin: 0;
            animation: flipIn 1s 0.2s cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes flipIn {
            from { opacity: 0; transform: rotateX(-60deg) translateY(25px); }
            to   { opacity: 1; transform: none; }
        }

        .welcome-card {
            max-width: 850px;
            margin: -50px auto 30px auto;
            background: white;
            border-radius: 14px;
            padding: 25px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            z-index: 2;
            animation: cardRise 0.9s 0.3s cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes cardRise {
            from { opacity: 0; transform: perspective(900px) rotateX(35deg) translateY(40px); }
            to   { opacity: 1; transform: none; }
        }

        .welcome-card h2 {
            margin: 0 0 5px 0;
            color: #7a1f4b;
            font-family: Georgia, serif;
        }

        .welcome-card p { margin: 0; color: #777; font-size: 14px; }

        .top-bar {
            max-width: 850px;
            margin: 0 auto 15px auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .top-bar h2 { color: #333; font-family: Georgia, serif; }

        /* ===== Filter / Search ===== */
        .filter-box {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-box input,
        .filter-box select {
            padding: 9px 16px;
            border: 1px solid #ddd;
            border-radius: 22px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: white;
            transition: 0.25s;
        }

        .filter-box input { width: 240px; }

        .filter-box input:focus,
        .filter-box select:focus {
            border-color: #7a1f4b;
            box-shadow: 0 0 0 3px rgba(122,31,75,0.15);
        }

        .result-count {
            max-width: 850px;
            margin: 0 auto 12px auto;
            padding: 0 20px;
            color: #888;
            font-size: 13px;
        }

        .blog-grid {
            max-width: 850px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
            perspective: 1200px;
        }

        .blog-card {
            background-color: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            transform-style: preserve-3d;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            animation: cardIn3d 0.7s cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes cardIn3d {
            from { opacity: 0; transform: rotateX(-50deg) translateY(40px) scale(0.92); }
            to   { opacity: 1; transform: none; }
        }

        .blog-card:hover {
            transform: rotateX(4deg) rotateY(-4deg) translateY(-8px) scale(1.02);
            box-shadow: 0 22px 40px rgba(122, 31, 75, 0.3);
        }

        /* Updated blog: 3D flip + glow */
        .blog-card.updated {
            animation: flipUpdate 1.2s cubic-bezier(.3,.7,.2,1) both;
        }

        @keyframes flipUpdate {
            0%   { transform: rotateY(0) scale(1); box-shadow: 0 0 0 0 rgba(122,31,75,0.7); }
            50%  { transform: rotateY(180deg) scale(1.08); box-shadow: 0 0 40px 12px rgba(122,31,75,0.55); }
            100% { transform: rotateY(360deg) scale(1); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
        }

        .blog-card-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .blog-card-body { padding: 16px 18px; flex: 1; display: flex; flex-direction: column; }

        .blog-card h3 {
            color: #7a1f4b;
            margin: 0 0 6px 0;
            font-family: Georgia, serif;
            font-size: 17px;
        }

        .blog-card p { color: #888; font-size: 12px; margin: 0 0 12px 0; }

        .blog-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .blog-actions button {
            background-color: #7a1f4b;
            color: white;
            border: none;
            font-size: 11px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(122, 31, 75, 0.35);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .blog-actions button:hover {
            background-color: #5c1739;
            transform: translateY(-2px) scale(1.05);
        }

        .empty-msg { grid-column: 1 / -1; color: #777; text-align: center; padding: 30px 0; }

        /* ===== Edit Modal ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            display: none;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 40px 15px;
            z-index: 1000;
            perspective: 1000px;
        }

        .modal-overlay.open { display: flex; }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 720px;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: modalIn 0.5s cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: rotateX(-45deg) scale(0.9); }
            to   { opacity: 1; transform: none; }
        }

        .modal-box h2 {
            margin: 0 0 10px 0;
            color: #7a1f4b;
            font-family: Georgia, serif;
        }

        .modal-box label {
            display: block;
            margin: 14px 0 6px 0;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }

        .modal-box input[type="text"],
        .modal-box textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        .modal-box input[type="text"]:focus,
        .modal-box textarea:focus {
            border-color: #7a1f4b;
            box-shadow: 0 0 0 3px rgba(122,31,75,0.15);
        }

        .modal-box textarea { min-height: 240px; resize: vertical; }

        .modal-box input:disabled { background: #f3f3f3; color: #777; }

        .modal-btns { display: flex; gap: 12px; margin-top: 22px; }

        .modal-btns button {
            border: none;
            padding: 10px 24px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .modal-btns button:hover { transform: translateY(-2px); }
        .modal-btns button:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-save { background-color: #7a1f4b; color: white; }
        .btn-cancel { background-color: #eee; color: #444; }

        /* ===== 3D "Blog Updated" message ===== */
        .success-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(40,8,25,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            perspective: 1000px;
        }

        .success-overlay.open { display: flex; }

        .success-box {
            background: linear-gradient(135deg, #7a1f4b, #5c1739);
            color: white;
            text-align: center;
            padding: 38px 46px;
            border-radius: 18px;
            max-width: 380px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: pop3d 1s cubic-bezier(.2,.9,.3,1.2) both;
        }

        @keyframes pop3d {
            0%   { opacity: 0; transform: rotateY(-120deg) rotateX(30deg) scale(0.3); }
            60%  { opacity: 1; transform: rotateY(12deg) rotateX(-6deg) scale(1.05); }
            100% { opacity: 1; transform: none; }
        }

        .success-tick {
            width: 76px;
            height: 76px;
            line-height: 76px;
            border-radius: 50%;
            background: white;
            color: #7a1f4b;
            font-size: 42px;
            margin: 0 auto 14px auto;
            animation: spin3d 1.2s 0.4s ease-out both;
        }

        @keyframes spin3d {
            from { transform: rotateY(0); }
            to   { transform: rotateY(720deg); }
        }

        .success-box h2 { margin: 0 0 6px 0; font-family: Georgia, serif; }
        .success-box p { margin: 0; color: #f3d9e6; font-size: 14px; word-break: break-word; }

        /* Small toast (delete / download messages) */
        .toast {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: #5c1739;
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            opacity: 0;
            transition: 0.4s;
            z-index: 3000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 500px) {
            .navbar { flex-direction: column; text-align: center; }
            .filter-box input { width: 100%; }
            .filter-box { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01s !important; }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>BlogSpace</h2>
        <div class="nav-links">
            <a href="./Index .html">Home</a>
            <a href="./create  blog.html">New Blog</a>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>

    <div class="hero">
        <h1 id="heroTitle">Welcome!</h1>
        <p>Manage your blog posts below.</p>
    </div>

    <div class="welcome-card">
        <h2 id="welcomeMsg">Welcome!</h2>
        <p>This is your dashboard. Create, edit, or remove your posts here.</p>
    </div>

    <div class="top-bar">
        <h2>My Blogs</h2>

        <!-- Filter / Search -->
        <div class="filter-box">
            <input type="text" id="searchInput" placeholder="Search by title, author or text...">
            <select id="sortSelect">
                <option value="new">Newest first</option>
                <option value="old">Oldest first</option>
                <option value="az">Title A to Z</option>
            </select>
        </div>
    </div>

    <div class="result-count" id="resultCount"></div>

    <div class="blog-grid" id="blogList">
        <p>Loading blogs...</p>
    </div>

    <!-- Edit Blog Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h2>Edit Blog</h2>

            <label for="editTitle">Title</label>
            <input type="text" id="editTitle">

            <label for="editAuthor">Author</label>
            <input type="text" id="editAuthor" disabled>

            <label for="editContent">Content</label>
            <textarea id="editContent"></textarea>

            <div class="modal-btns">
                <button class="btn-save" id="saveEditBtn">Save Changes</button>
                <button class="btn-cancel" id="cancelEditBtn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- 3D success message -->
    <div class="success-overlay" id="successModal">
        <div class="success-box">
            <div class="success-tick">&#10003;</div>
            <h2>Blog Updated!</h2>
            <p id="successTitle"></p>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var user = JSON.parse(localStorage.getItem("user"));
        if (user) {
            document.getElementById("heroTitle").textContent = "Welcome back, " + user.name + "!";
            document.getElementById("welcomeMsg").textContent = "Welcome, " + user.name + "!";
        } else {
            window.location.href = "Login .html";
        }

        document.getElementById("logoutBtn").addEventListener("click", function () {
            if (confirm("Are you sure you want to logout?")) {
                localStorage.removeItem("user");
                window.location.href = "Login .html";
            }
        });

        var defaultImages = [
            "https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=500&q=60",
            "https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=500&q=60",
            "https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=500&q=60",
            "https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=500&q=60"
        ];

        var allBlogs = [];
        var currentEditId = null;

        var searchInput = document.getElementById("searchInput");
        var sortSelect = document.getElementById("sortSelect");

        function showToast(msg) {
            var t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            setTimeout(function () { t.classList.remove("show"); }, 2500);
        }

        // ===== Load blogs from server =====
        function loadBlogs(updatedId) {
            fetch("http://localhost:5000/api/blog")
                .then(response => response.json())
                .then(blogs => {
                    allBlogs = Array.isArray(blogs) ? blogs : [];
                    renderBlogs(updatedId);
                })
                .catch(err => {
                    console.log(err);
                    document.getElementById("blogList").innerHTML = "<p>Blogs could not be loaded.</p>";
                });
        }

        // ===== Show blogs (with search + sort filter) =====
        function renderBlogs(updatedId) {
            var blogList = document.getElementById("blogList");
            var q = searchInput.value.trim().toLowerCase();
            var sort = sortSelect.value;

            var blogs = allBlogs.filter(function (b) {
                return (b.title || "").toLowerCase().indexOf(q) !== -1 ||
                       (b.author || "").toLowerCase().indexOf(q) !== -1 ||
                       (b.content || "").toLowerCase().indexOf(q) !== -1;
            });

            blogs.sort(function (a, b) {
                if (sort === "az") return (a.title || "").localeCompare(b.title || "");
                var da = new Date(a.createdAt).getTime() || 0;
                var db = new Date(b.createdAt).getTime() || 0;
                return sort === "old" ? da - db : db - da;
            });

            blogList.innerHTML = "";
            document.getElementById("resultCount").textContent =
                allBlogs.length === 0 ? "" : "Showing " + blogs.length + " of " + allBlogs.length + " blogs";

            if (allBlogs.length === 0) {
                blogList.innerHTML = "<p class='empty-msg'>No blogs yet. Create a new blog!</p>";
                return;
            }

            if (blogs.length === 0) {
                blogList.innerHTML = "<p class='empty-msg'>No blogs match your search.</p>";
                return;
            }

            blogs.forEach(function (blog, index) {
                var date = new Date(blog.createdAt).toDateString();
                var originalIndex = allBlogs.indexOf(blog);
                var imgSrc = blog.imageUrl && blog.imageUrl.trim() !== ""
                    ? blog.imageUrl
                    : defaultImages[originalIndex % defaultImages.length];

                var card = document.createElement("div");
                card.className = "blog-card";
                if (blog._id === updatedId) {
                    card.classList.add("updated");
                } else {
                    card.style.animationDelay = (index * 0.08) + "s";
                }

                var img = document.createElement("img");
                img.className = "blog-card-img";
                img.src = imgSrc;
                img.alt = blog.title;
                img.addEventListener("click", function () {
                    window.location.href = "blog -detail.html?id=" + blog._id;
                });

                var body = document.createElement("div");
                body.className = "blog-card-body";

                var titleEl = document.createElement("h3");
                titleEl.textContent = blog.title;
                titleEl.addEventListener("click", function () {
                    window.location.href = "blog -detail.html?id=" + blog._id;
                });

                var metaEl = document.createElement("p");
                metaEl.textContent = "By " + blog.author + " - " + date;

                var actionsDiv = document.createElement("div");
                actionsDiv.className = "blog-actions";

                var editBtn = document.createElement("button");
                editBtn.textContent = "Edit";
                editBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    editBlog(blog._id);
                });

                var deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";
                deleteBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    deleteBlog(blog._id);
                });

                var downloadBtn = document.createElement("button");
                downloadBtn.textContent = "Download";
                downloadBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    downloadBlog(blog.title, blog.content, blog.author);
                });

                actionsDiv.appendChild(editBtn);
                actionsDiv.appendChild(deleteBtn);
                actionsDiv.appendChild(downloadBtn);

                body.appendChild(titleEl);
                body.appendChild(metaEl);
                body.appendChild(actionsDiv);

                card.appendChild(img);
                card.appendChild(body);
                blogList.appendChild(card);
            });
        }

        // Filter events
        searchInput.addEventListener("input", function () { renderBlogs(); });
        sortSelect.addEventListener("change", function () { renderBlogs(); });

        // ===== Delete =====
        function deleteBlog(id) {
            if (!confirm("Are you sure you want to delete this blog?")) return;
            fetch("http://localhost:5000/api/blog/" + id, { method: "DELETE" })
                .then(function (response) {
                    if (!response.ok) throw new Error("Server error " + response.status);
                    return response.json().catch(function () { return {}; });
                })
                .then(function (data) {
                    showToast(data.message || "Blog deleted");
                    loadBlogs();
                })
                .catch(function (err) {
                    alert("Could not delete the blog.");
                    console.log(err);
                });
        }

        // ===== Edit: poora blog modal mein khulta hai =====
        var editModal = document.getElementById("editModal");
        var editTitle = document.getElementById("editTitle");
        var editAuthor = document.getElementById("editAuthor");
        var editContent = document.getElementById("editContent");

        function editBlog(id) {
            var blog = allBlogs.find(function (b) { return b._id === id; });
            if (!blog) {
                alert("Blog not found.");
                return;
            }

            currentEditId = id;
            editTitle.value = blog.title || "";
            editAuthor.value = blog.author || "";
            editContent.value = blog.content || "";
            editModal.classList.add("open");
        }

        function closeEditModal() {
            editModal.classList.remove("open");
            currentEditId = null;
        }

        document.getElementById("cancelEditBtn").addEventListener("click", closeEditModal);

        editModal.addEventListener("click", function (e) {
            if (e.target === editModal) closeEditModal();
        });

        // ===== Save edit + 3D success message =====
        var successModal = document.getElementById("successModal");

        successModal.addEventListener("click", function () {
            successModal.classList.remove("open");
        });

        document.getElementById("saveEditBtn").addEventListener("click", function () {
            var newTitle = editTitle.value.trim();
            var newContent = editContent.value.trim();

            if (newTitle === "" || newContent === "") {
                alert("Title and content cannot be empty.");
                return;
            }

            var saveBtn = document.getElementById("saveEditBtn");
            var id = currentEditId;
            saveBtn.disabled = true;
            saveBtn.textContent = "Saving...";

            fetch("http://localhost:5000/api/blog/" + id, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    title: newTitle,
                    content: newContent
                })
            })
            .then(function (response) {
                if (!response.ok) throw new Error("Server error " + response.status);
                return response.json().catch(function () { return {}; });
            })
            .then(function () {
                closeEditModal();
                loadBlogs(id);
                document.getElementById("successTitle").textContent = newTitle;
                successModal.classList.add("open");
                setTimeout(function () { successModal.classList.remove("open"); }, 2300);
            })
            .catch(function (err) {
                alert("Could not update the blog.");
                console.log(err);
            })
            .then(function () {
                saveBtn.disabled = false;
                saveBtn.textContent = "Save Changes";
            });
        });

        // ===== Download =====
        function downloadBlog(title, content, author) {
            var text = "Title: " + title + "\nAuthor: " + author + "\n\n" + content;
            var blob = new Blob([text], { type: "text/plain" });
            var link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = title.replace(/[^a-z0-9]/gi, "_") + ".txt";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showToast("Blog downloaded");
        }

        loadBlogs();
    </script>

</body>
</html>
