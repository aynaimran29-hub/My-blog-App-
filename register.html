<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Page</title>

<style>
    /* Basic page setup */
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 10;
        padding: 0;
    }

    /* Simple navbar */
    .navbar {
        background-color: #7a1f4b;
        padding: 10px;
        text-align: center;
    }

    .navbar h2 {
        color: white;
        margin: 5;
    }

    /* Register box in the center */
    .Register-box {
        background-color: white;
        width: 420px;
        margin: 50px auto;
        padding: 20px;
        border: 10px solid #ccc;
        border-radius: 5px;
    }

    .Register-box h2 {
        text-align: center;
        color: #7a1f4b;
    }

    /* Form styling */
    label {
        display: block;
        margin-top: 10px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 6px;
        border: 100px solid #ccc;
        border-radius: 4px;
    }

    /* Error text */
    .error {
        color: red;
        font-size: 13px;
        display: none;
    }

    /* Register button */
    button {
        width: 100%;
        padding: 10px;
        margin-top: 2px;
        background-color: #7a1f4b;
        color: white;
        border: none;
        border-radius: 2px;
        cursor: pointer;
    }

    button:hover {
        background-color: #5c1739;
    }

    /* Login link */
    .login-text {
        text-align: center;
        margin-top: 10px;
    }

    /* Success message */
    .success {
        color: green;
        text-align: center;
        display: none;
        margin-top: 15px;
    }

    /* Make it responsive on small screens */
    @media (max-width: 400px) {
        .Register-box {
            width: 90%;
        }
    }
</style>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif !important;
        background:
            linear-gradient(rgba(60,10,35,0.72), rgba(60,10,35,0.72)),
            url("https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1600&q=70") center/cover fixed,
            #5c1739 !important;
        min-height: 100vh;
    }

    .navbar {
        background: rgba(60,10,35,0.55) !important;
    }

    .navbar h2, h1, h2 {
        font-family: 'Playfair Display', serif !important;
    }

    .register-box, .login-box, .form-box {
        background-color: rgba(255,255,255,0.96) !important;
        border-radius: 16px !important;
        box-shadow: 0 12px 34px rgba(0,0,0,0.35) !important;
    }

    input {
        font-family: 'Poppins', sans-serif !important;
        border: 1px solid #e6d5de !important;
        border-radius: 10px !important;
        padding: 11px 14px !important;
    }

    input:focus {
        outline: none !important;
        border-color: #7a1f4b !important;
        box-shadow: 0 0 0 3px rgba(122,31,75,0.15) !important;
    }

    button {
        font-family: 'Poppins', sans-serif !important;
        background: linear-gradient(90deg, #7a1f4b, #5c1739) !important;
        border-radius: 20px !important;
        font-weight: 600 !important;
    }
</style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>BlogSpace</h2>
    </div>

    <!-- Register Form -->
    <div class="Register-box">
        <h2>Register</h2>

        <p class="success" id="successMsg">Account created successfully!</p>


        <form id="RegisterForm">

            <label for="name"> name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <p class="error" id="nameError">Please enter your name</p>

            <label for="email">email</label>
            <input type="email" id="email" placeholder="Enter your email">
            <p class="error" id="emailError">Please enter a valid email</p>

            <label for="password">password</label>
            <input type="password" id="password" placeholder="Create a password">
            <p class="error" id="passwordError">Password must be at least 6 characters</p>

            <label for="confirmPassword">ConfirmPassword</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password">
            <p class="error" id="confirmError">Passwords do not match</p>

            <button type="Register">Submit</button>
        

        </form>

        <p class="login-text">
            Already have an account? <a href="./Login .html">Login here</a>
        </p>
    
    </div>

<script>
    // Get form and input elements
    var form = document.getElementById("RegisterForm");
    var nameInput = document.getElementById("name");
    var email = document.getElementById("email");
    var password = document.getElementById("password");
    var confirmPassword = document.getElementById("confirmPassword");

    var nameError = document.getElementById("nameError");
    var emailError = document.getElementById("emailError");
    var passwordError = document.getElementById("passwordError");
    var confirmError = document.getElementById("confirmError");
    var successMsg=document.getElementById("successMsg")


    // Run this when the form is submitted
    form.addEventListener("submit", function (e) {
        e.preventDefault(); // stop the form from refreshing the page

        var isValid = true;

        // Check name is not empty
        if (nameInput.value.trim() === "") {
            nameError.style.display = "block";
            isValid = false;
        } else {
            nameError.style.display = "none";
        }

        // Check email contains @ and .
        if (email.value.includes("@") && email.value.includes(".")) {
            emailError.style.display = "none";
        } else {
            emailError.style.display = "block";
            isValid = false;
        }

        // Check password length
        if (password.value.length >= 6) {
            passwordError.style.display = "none";
        } else {
            passwordError.style.display = "block";
            isValid = false;
        }

        // Check password and confirm password match
        if (confirmPassword.value === password.value && confirmPassword.value !== "") {
            confirmError.style.display = "none";
        } else {
            confirmError.style.display = "block";
            isValid = false;
        }

        // If everything is correct, send data to backend
if (isValid) {
    fetch("http://localhost:5000/api/Register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name: nameInput.value,
            email: email.value,
            password: password.value
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.message === "Registration successful!") {
            successMsg.style.display = "block";
            setTimeout(function () {
                window.location.href ="./Login .html"
            }, 1000);
        } else {
            alert(data.message); 
        }
    })
    .catch(err => {
        alert("NOT Connect the server first check this backend is perform work or not.");
        console.log(err);
    });
}
    });
</script>

</body>
</html>
