<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Page</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }

    body {
        font-family: 'Poppins', sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background:
            linear-gradient(rgba(60,10,35,0.72), rgba(60,10,35,0.72)),
            url("https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1600&q=70") center/cover fixed,
            #5c1739;
    }

    .navbar {
        background: rgba(60,10,35,0.55);
        padding: 14px;
        text-align: center;
    }

    .navbar h2 {
        font-family: 'Playfair Display', serif;
        color: white;
        margin: 0;
    }

    .register-box {
        background-color: rgba(255,255,255,0.96);
        width: 90%;
        max-width: 420px;
        margin: 40px auto;
        padding: 26px;
        border-radius: 16px;
        box-shadow: 0 12px 34px rgba(0,0,0,0.35);
    }

    .register-box h2 {
        font-family: 'Playfair Display', serif;
        text-align: center;
        color: #7a1f4b;
        margin-top: 0;
    }

    label {
        display: block;
        margin-top: 12px;
        margin-bottom: 5px;
        font-weight: 600;
        font-size: 14px;
    }

    input {
        width: 100%;
        font-family: 'Poppins', sans-serif;
        border: 1px solid #e6d5de;
        border-radius: 10px;
        padding: 11px 14px;
        font-size: 14px;
    }

    input:focus {
        outline: none;
        border-color: #7a1f4b;
        box-shadow: 0 0 0 3px rgba(122,31,75,0.15);
    }

    .error {
        color: red;
        font-size: 13px;
        margin: 4px 0 0 0;
        display: none;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 11px;
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        font-size: 15px;
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        background: linear-gradient(90deg, #7a1f4b, #5c1739);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(122,31,75,0.35);
    }

    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .login-text { text-align: center; margin-top: 14px; font-size: 14px; }
    .login-text a { color: #7a1f4b; font-weight: 600; }

    .success {
        color: green;
        text-align: center;
        display: none;
        margin-top: 12px;
    }
</style>
</head>
<body>

    <div class="navbar">
        <h2>BlogSpace</h2>
    </div>

    <div class="register-box">
        <h2>Register</h2>

        <p class="success" id="successMsg">Account created successfully!</p>

        <form id="RegisterForm">

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <p class="error" id="nameError">Please enter your name</p>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
            <p class="error" id="emailError">Please enter a valid email</p>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password">
            <p class="error" id="passwordError">Password must be at least 6 characters</p>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password">
            <p class="error" id="confirmError">Passwords do not match</p>

            <button type="submit" id="registerBtn">Register</button>

        </form>

        <p class="login-text">
            Already have an account? <a href="./login.html">Login here</a>
        </p>
    </div>

<script src="config.js"></script>
<script>
    var form = document.getElementById("RegisterForm");
    var nameInput = document.getElementById("name");
    var email = document.getElementById("email");
    var password = document.getElementById("password");
    var confirmPassword = document.getElementById("confirmPassword");

    var nameError = document.getElementById("nameError");
    var emailError = document.getElementById("emailError");
    var passwordError = document.getElementById("passwordError");
    var confirmError = document.getElementById("confirmError");
    var successMsg = document.getElementById("successMsg");
    var registerBtn = document.getElementById("registerBtn");

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        var isValid = true;

        if (nameInput.value.trim() === "") {
            nameError.style.display = "block";
            isValid = false;
        } else {
            nameError.style.display = "none";
        }

        if (email.value.includes("@") && email.value.includes(".")) {
            emailError.style.display = "none";
        } else {
            emailError.style.display = "block";
            isValid = false;
        }

        if (password.value.length >= 6) {
            passwordError.style.display = "none";
        } else {
            passwordError.style.display = "block";
            isValid = false;
        }

        if (confirmPassword.value === password.value && confirmPassword.value !== "") {
            confirmError.style.display = "none";
        } else {
            confirmError.style.display = "block";
            isValid = false;
        }

        if (!isValid) return;

        registerBtn.disabled = true;
        registerBtn.textContent = "Please wait...";

        fetch(API_URL + "/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: nameInput.value.trim(),
                email: email.value.trim(),
                password: password.value
            })
        })
        .then(function (response) { return response.json(); })
        .then(function (data) {
            if (data.message === "Registration successful!") {
                successMsg.style.display = "block";
                setTimeout(function () {
                    window.location.href = "./login.html";
                }, 1000);
            } else {
                alert(data.message);
                registerBtn.disabled = false;
                registerBtn.textContent = "Register";
            }
        })
        .catch(function (err) {
            alert("Could not connect to the server. Check that the backend is running.");
            console.log(err);
            registerBtn.disabled = false;
            registerBtn.textContent = "Register";
        });
    });
</script>

</body>
</html>
